# Reference configuration only. This is intentionally human/agent readable rather than a private ChatGPT API export.
# Copy the prompt files into your scheduler/automation platform.

automations:
  - title: Follow Builders 日报
    task_id: follow-builders-daily
    timing_mode: exact_schedule
    timezone: Asia/Shanghai
    ical: |
      BEGIN:VEVENT
      DTSTART;TZID=Asia/Shanghai:20260101T080000
      RRULE:FREQ=DAILY
      END:VEVENT
    prompt_file: prompts/follow-builders-daily.zh-CN.md
    post_report_blog_candidates: suggestion_only
    blog_target_example: MarkTian-Long/marktian-long.github.io
    blog_writes_require_explicit_user_confirmation: true

  - title: AIHOT 每日情报
    task_id: aihot-daily
    timing_mode: exact_schedule
    timezone: Asia/Shanghai
    ical: |
      BEGIN:VEVENT
      DTSTART;TZID=Asia/Shanghai:20260101T081000
      RRULE:FREQ=DAILY
      END:VEVENT
    prompt_file: prompts/aihot-daily.zh-CN.md
    post_report_blog_candidates: suggestion_only
    blog_target_example: MarkTian-Long/marktian-long.github.io
    blog_writes_require_explicit_user_confirmation: true
